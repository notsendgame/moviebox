name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MovieBox iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-app
          xcodegen generate

      - name: Build App with Xcodebuild
        run: |
          cd ios-app
          xcodebuild -project MovieBox.xcodeproj \
            -scheme MovieBox \
            -configuration Release \
            -destination "generic/platform=iOS" \
            SYMROOT=build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios-app/build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r MovieBox.ipa Payload
          echo "IPA Created Successfully!"

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.5"
          name: "MovieBox iOS App v1.0.5 (Android Feature Parity: ShortTV, VIP Unlocked, Genre Stream Fix)"
          body: |
            ### MovieBox iOS v1.0.5 - Android Feature Parity Edition
            1. **Tidak Ada Lagi Video Ngawur / Tertukar**: Sistem stream pool acak telah dihapus total. Setiap genre dan judul (Horor, Aksi, Romansa, Animasi, Thriller, Drama Indonesia & K-Drama) dipetakan secara akurat sesuai jenis dan part aslinya.
            2. **Fitur ShortTV Vertikal (Micro-Drama TikTok Style)**: Tab ShortTV kini memutar drama pendek vertikal dengan navigasi swipe atas/bawah, like, comment, dan share persis MovieBox Android.
            3. **VIP Permanent Unlocked (Fitur MOD Android)**: Resolusi 1080P/4K otomatis aktif, bebas seluruh iklan, dan kecepatan download maksimal tanpa perlu berlangganan.
            4. **Panel Unduh Offline**: Menekan tombol unduh membuka bottom sheet pemilihan resolusi (1080P, 720P, 480P) dan pemilihan episode untuk disimpan offline.
            5. **Player Inline 16:9 & Part Selector 01-16**: Navigasi episode lengkap persis seperti pada tangkapan layar Android.
          files: build/MovieBox.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
