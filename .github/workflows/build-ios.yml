name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MovieBox iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-app
          xcodegen generate

      - name: Build App with Xcodebuild
        run: |
          cd ios-app
          xcodebuild -project MovieBox.xcodeproj \
            -scheme MovieBox \
            -configuration Release \
            -destination "generic/platform=iOS" \
            SYMROOT=build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios-app/build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r MovieBox.ipa Payload
          echo "IPA Created Successfully!"

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.3"
          name: "MovieBox iOS App v1.0.3 (Fixed Unique Video Streams)"
          body: "Fixed video playback so every movie and drama plays its own real streaming video (no more Moana loop)."
          files: build/MovieBox.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
