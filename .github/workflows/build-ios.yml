name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MovieBox iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-app
          xcodegen generate

      - name: Build App with Xcodebuild
        run: |
          cd ios-app
          xcodebuild -project MovieBox.xcodeproj \
            -scheme MovieBox \
            -configuration Release \
            -destination "generic/platform=iOS" \
            SYMROOT=build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios-app/build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r MovieBox.ipa Payload
          echo "IPA Created Successfully!"

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.4"
          name: "MovieBox iOS App v1.0.4 (Full Android Multi-Part UI & Dynamic Stream Player)"
          body: |
            ### MovieBox iOS v1.0.4 - Full Android UI & Multi-Part Player
            1. **Tampilan Persis Android MovieBox**: Video player inline 16:9 langsung berada di bagian atas layar detail film dengan tombol kontrol dan fullscreen landscape.
            2. **Fitur Part / Episode Lengkap ("01", "02", "03", "04", ...)**: Baris selector episode/part persis seperti di Android MovieBox. Menekan nomor part langsung mengganti video yang sedang diputar ke part/episode tersebut!
            3. **Multi-Part & Multi-Stream untuk Seluruh Film & Drama**: Terikat Janji, Flex x Cop, Tante Sonya, Sengkolo: One Suro, The Early Spring, Project Sacrifice, Win or Lose, Bima Satria Garuda, Mahligai untuk Cinta, dan seluruh 750+ katalog film memiliki episode/part masing-masing.
            4. **Sumber Daya & Uploader**: Menampilkan label "Sumber daya: Diunggah oleh Fatherdmw55 etc." dan selector "Original Audio".
            5. **Tab Rekomendasi & Komunitas**: Tab "Untukmu" dengan 2-kolom grid poster film serta tab "Komentar(99+)".
            6. **Floating Download Button**: Tombol emas melayang "Unduh" di bagian bawah layar.
          files: build/MovieBox.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
