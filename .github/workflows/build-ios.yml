name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build MovieBox iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build App with Xcodebuild
        run: |
          cd ios-app
          xcodebuild -project MovieBox.xcodeproj \
            -scheme MovieBox \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios-app/build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r MovieBox.ipa Payload
          echo "IPA Created Successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-iOS-IPA
          path: build/MovieBox.ipa
