name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build MovieBox iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build App with Xcodebuild
        run: |
          cd ios-app
          xcodebuild -project MovieBox.xcodeproj \
            -scheme MovieBox \
            -configuration Release \
            -destination "generic/platform=iOS" \
            SYMROOT=build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee xcodebuild.log

      - name: Dump Log to Summary
        if: always()
        run: |
          echo "### Xcodebuild Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat ios-app/xcodebuild.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcodebuild-Log
          path: ios-app/xcodebuild.log

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios-app/build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r MovieBox.ipa Payload
          echo "IPA Created Successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-iOS-IPA
          path: build/MovieBox.ipa
